[project] # https://zensical.org/docs/get-started/
site_name = "My Awesome Project"
site_url = "https://my-awesome-project.readthedocs.io/"
site_description = "Documentation site for My Awesome Python package."
site_author = "John Doe"
copyright = "Copyright &copy; <span id='year-copyright'></span> John Doe"
docs_dir = "docs"
site_dir = "docs/_build"
dev_addr = "localhost:3000"
repo_url = "https://github.com/john-doe/my-awesome-project"
nav = []

[project.theme]
variant = "slate"
logo = "assets/logo-dark.svg"
favicon = "assets/logo.svg"
font.text = "Inter"
language = "en"
features = [
    "announce.dismiss",
    "header.autohide",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.progress",
    "search.highlight"
]

[project.theme.icon]
repo = "fontawesome/brands/github"
previous = "fontawesome/solid/angle-left"
next = "fontawesome/solid/angle-right"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
scheme = "slate"
primary = "blue"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "deep orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.extra]
generator = false

[project.extra.consent]
title = "Cookie consent"
description = """
    We use cookies to recognize your repeated visits and preferences, as well
    as to measure the effectiveness of our documentation and whether users
    find what they're searching for. With your consent, you're helping us to
    make our documentation better.
"""
actions = [
    "accept",
    "reject"
]

[[project.extra_javascript]]
path = "scripts/extra.js"
async = true

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/john-doe"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/john-doe"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = false
summary = true
group_by_category = true
merge_init_into_class = true
docstring_options.ignore_init_summary = false
