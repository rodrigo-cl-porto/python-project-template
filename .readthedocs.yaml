version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

  jobs:
    build:
      html:
        - uv run --group docs zensical build
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive docs/_build/* $READTHEDOCS_OUTPUT/html/

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
