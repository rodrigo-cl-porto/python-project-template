[project]
name = "my-awesome-project"
version = "0.1.0"
description = "Add your description here."
keywords = ["Python Project Template", "Template", "My Awesome Project", "Awesome"]
readme = "README.md"
license = { file = "LICENSE.md" }
classifiers = [
    "Development Status :: 1 - Planning",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.13",
    "Framework :: Pytest",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed"
]
authors = [
    { name = "John Doe", email = "john.doe@mail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.urls]
"Source Code" = "https://github.com/john-doe/my-awesome-project"
"Documentation" = "https://my-awesome-project.readthedocs.io/"
"LinkedIn Profile" = "https://www.linkedin.com/in/john-doe/"
"GitHub Profile" = "https://github.com/john-doe"

[project.markdown_extensions]
mkdocstrings = { handler = "python" }

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "ty>=0.0.69",
]
docs = [
    "mkdocstrings>=1.0.6",
    "zensical>=0.0.53",
]
